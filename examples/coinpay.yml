# Optional repo config. Place at .github/coinpay.yml in a consumer repo.
# All keys are optional; product defaults are shown.
enabled: true
contributionRewards:
  enabled: false
  rateUsd: '0.001'
  payment: manual
defaultCrypto: usdc_pol
defaultFiat: USD
minRoleToCreateInvoice: collaborator   # owner | member | collaborator
requireApprovalForNonMaintainers: true
labels:
  requested: coinpay:requested
  pending: coinpay:pending
  approved: coinpay:approved
  paid: coinpay:paid
  expired: coinpay:expired
  cancelled: coinpay:cancelled
  error: coinpay:error
commands:
  invoice: true
  approve: true
  status: true
  cancel: true
# `/coinpay create @payer <amount> "<description>"` — publish a real invoice
# from THIS REPOSITORY'S configured CoinPayPortal business. Disabled by
# default: enable it only after the CoinPayPortal idempotent invoice
# deployment (API + migration) is live, or every command fails with a
# temporary-unavailability reply. Open to all human commenters once enabled;
# the payer mention is a GitHub reference, not a linked CoinPay account.
githubInvoices:
  enabled: false
  maxAmountUsd: 1000        # per-invoice cap (USD, up to 2 decimals)
  repositoryHourlyCap: 20   # per-repository hourly cap enforced by the API (1-1000)
